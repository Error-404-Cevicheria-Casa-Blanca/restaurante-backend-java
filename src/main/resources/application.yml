server:
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:43200000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://casa-blanca.local,https://192.168.1.10,http://localhost:8000,http://127.0.0.1:8000}
